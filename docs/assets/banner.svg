<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="400" viewBox="0 0 1280 400" role="img" aria-labelledby="title desc">
  <title id="title">S3 Serial</title><desc id="desc">Wi-Fi serial and RS485 debugger. A local workspace for every byte.</desc>
  <defs>
    <linearGradient id="bg" x2="1" y2="1"><stop stop-color="#092f37"/><stop offset="1" stop-color="#0e5653"/></linearGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse"><path d="M32 0H0V32" fill="none" stroke="#d4f6e4" stroke-opacity=".05"/></pattern>
    <linearGradient id="wave"><stop stop-color="#79dfb8" stop-opacity="0"/><stop offset=".5" stop-color="#79dfb8"/><stop offset="1" stop-color="#79dfb8" stop-opacity="0"/></linearGradient>
  </defs>
  <rect width="1280" height="400" rx="20" fill="url(#bg)"/>
  <rect width="1280" height="400" rx="20" fill="url(#grid)"/>
  <circle cx="1190" cy="-40" r="280" fill="#78d8b4" opacity=".035"/>
  <circle cx="1160" cy="400" r="200" fill="#78d8b4" opacity=".04"/>
  <g font-family="Segoe UI,Arial,sans-serif">
    <rect x="56" y="54" width="52" height="52" rx="15" fill="#e5f8ed"/>
    <path d="M67 81q7-20 14 0t15 0" fill="none" stroke="#0e766e" stroke-width="4" stroke-linecap="round"/>
    <text x="124" y="78" fill="#b5d6cd" font-size="13" font-weight="600" letter-spacing="3">A LOCAL WORKSPACE</text>
    <text x="124" y="99" fill="#7eb1a6" font-size="12" letter-spacing="2">FOR EVERY BYTE</text>
    <text x="53" y="203" fill="#f2fff8" font-size="79" font-weight="700" letter-spacing="-3">S3 Serial<tspan fill="#8ee2ba">.</tspan></text>
    <text x="58" y="248" fill="#c1dfd4" font-size="22" letter-spacing="1">Your serial. Any screen.</text>
    <g font-size="12" font-weight="600" fill="#c4e6d7">
      <rect x="57" y="287" width="72" height="30" rx="15" fill="#ffffff" opacity=".08"/><text x="78" y="307">Wi-Fi</text>
      <rect x="139" y="287" width="86" height="30" rx="15" fill="#ffffff" opacity=".08"/><text x="160" y="307">UART1</text>
      <rect x="235" y="287" width="86" height="30" rx="15" fill="#ffffff" opacity=".08"/><text x="255" y="307">RS485</text>
      <text x="58" y="355" fill="#86aea1" font-size="11" letter-spacing="1.7">ESP32-S3  /  OFFLINE WEB UI  /  OPEN SOURCE</text>
    </g>
    <g transform="translate(670 58)">
      <rect width="550" height="286" rx="14" fill="#051f27" stroke="#6bb99b" stroke-opacity=".35"/>
      <path d="M14 0H536a14 14 0 0 1 14 14v27H0V14A14 14 0 0 1 14 0" fill="#ffffff" opacity=".05"/>
      <circle cx="20" cy="20" r="4" fill="#6b9d8c"/><circle cx="35" cy="20" r="4" fill="#6b9d8c" opacity=".65"/><circle cx="50" cy="20" r="4" fill="#6b9d8c" opacity=".4"/>
      <text x="81" y="24" fill="#a4c8b9" font-size="11">192.168.4.1</text>
      <circle cx="467" cy="20" r="3" fill="#8ee2ba"/><text x="479" y="24" fill="#8ee2ba" font-size="10">LOCAL</text>
      <text x="26" y="78" fill="#dcf5e9" font-size="15" font-weight="600">Serial monitor</text>
      <rect x="403" y="60" width="120" height="26" rx="6" fill="#133d3c"/>
      <text x="419" y="77" fill="#97c6b4" font-family="Consolas,monospace" font-size="11">115200 · 8N1</text>
      <path d="M26 98H523" stroke="#c6e8d6" stroke-opacity=".1"/>
      <g font-family="Consolas,monospace" font-size="13">
        <text x="28" y="129" fill="#7bb5e4">TX</text><text x="75" y="129" fill="#abcbbb">01 03 00 00 00 02 C4 0B</text>
        <text x="28" y="165" fill="#8ee2ba">RX</text><text x="75" y="165" fill="#e1f5e8">01 03 04 00 7B 00 2D 4A 37</text>
      </g>
      <path d="M27 221h52v-18h32v36h31v-36h31v18h45v-18h31v36h31v-36h31v18h185" stroke="url(#wave)" stroke-width="2" fill="none"/>
      <text x="28" y="266" fill="#679c87" font-size="10" letter-spacing="2">CONNECT  ·  INSPECT  ·  SEND  ·  EXPORT</text>
    </g>
    <text x="1154" y="376" fill="#78ac97" font-size="11">v1.0.0 / MIT</text>
  </g>
</svg>
